name: Update README citations

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: update-readme-citations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-readme:
    name: Regenerate README citation block
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs tools
        run: python -m pip install --upgrade pip ".[docs]"

      - name: Update README citation block
        run: python tools/update_readme_mixing_references.py

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README citation block is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README citations"
          git push origin HEAD:${GITHUB_REF_NAME}
